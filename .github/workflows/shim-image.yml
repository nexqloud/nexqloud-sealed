name: sealed-shim image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "cmd/shim/**"
      - "internal/**"
      - "pkg/**"
      - "deploy/shim/**"
      - "go.mod"
      - "go.sum"
      - ".dockerignore"
      - ".github/workflows/shim-image.yml"
  pull_request:
    paths:
      - "cmd/shim/**"
      - "internal/**"
      - "pkg/**"
      - "deploy/shim/**"
      - "go.mod"
      - "go.sum"
      - ".dockerignore"
      - ".github/workflows/shim-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/sealed-shim

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/shim/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest (keyless → Rekor)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "missing image digest from build-push" >&2
            exit 1
          fi
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"

      # Tier A (sev-snp-measure + expected launch measurement → Rekor) is deferred
      # until ghcr.io/nexqloud/sealed-base-os (OVMF.fd + bzImage) is published.
