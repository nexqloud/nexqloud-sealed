name: sealed-initrd

# Build static sealed-shim into a measured initrd, predict the SNP launch
# measurement, cosign-sign to Rekor (push), publish boot bundle to R2.
#
# Scripts: .github/workflows/sealed-initrd/
# Guest PID1: cmd/sealed-init
#
# R2 (public bucket nexqloud-sealed-ai), per environment:
#   staging/sealed-initrd/<sha>/...  + staging/sealed-initrd/latest/...
#   production/sealed-initrd/<sha>/... + production/sealed-initrd/latest/...

on:
  workflow_dispatch:
  push:
    branches: [stage, main]
    paths:
      - "cmd/shim/**"
      - "cmd/sealed-init/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/sealed-initrd.yml"
      - ".github/workflows/sealed-initrd/**"
  pull_request:
    branches: [stage, main]
    paths:
      - "cmd/shim/**"
      - "cmd/sealed-init/**"
      - "internal/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/sealed-initrd.yml"
      - ".github/workflows/sealed-initrd/**"

permissions:
  contents: read
  id-token: write

env:
  KATA_VERSION: "4.0.0"
  VCPU_TYPE: "EPYC-v4"
  APPEND: "console=ttyS0 earlyprintk=serial,ttyS0 noreplace-smp"
  OUT: out/sealed-initrd
  R2_ACCOUNT_ID: "285ada7dda5a9110cc820302071df4f1"
  R2_BUCKET: "nexqloud-sealed-ai"
  R2_PUBLIC_BASE_URL: "https://pub-84b99924d959400aa97608c84bbd8000.r2.dev"

jobs:
  build-measure:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.ref == 'refs/heads/stage' && 'staging' || github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy environment
        id: env
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/heads/stage)
              echo "name=staging" >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/main|refs/tags/v*)
              echo "name=production" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "name=preview" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd cpio gzip python3-venv ca-certificates curl unzip

      - name: Install AWS CLI (R2 S3 API)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update
          aws --version

      - name: Build measured initrd bundle
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          chmod +x .github/workflows/sealed-initrd/*.sh
          .github/workflows/sealed-initrd/build.sh

      - name: Pack boot bundle
        id: pack
        run: |
          set -euo pipefail
          BUNDLE="sealed-initrd-bundle-${{ github.sha }}.tgz"
          tar -C "${OUT}" -czf "${BUNDLE}" \
            sealed-initrd.img \
            AMDSEV.fd \
            vmlinuz \
            expected-measurement.txt \
            kernel-cmdline.txt \
            MANIFEST.txt \
            run-vm.sh \
            rootfs/sealed-shim \
            rootfs/init
          ls -lh "${BUNDLE}"
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"
          echo "---- MANIFEST ----"
          cat "${OUT}/MANIFEST.txt"

      - name: Upload GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealed-initrd-bundle-${{ github.sha }}
          path: sealed-initrd-bundle-${{ github.sha }}.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign measurement blob (keyless → Rekor)
        if: github.event_name != 'pull_request'
        id: sign
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "${OUT}/expected-measurement.sigstore.json" \
            "${OUT}/expected-measurement.txt"
          cosign sign-blob --yes \
            --bundle "${OUT}/MANIFEST.sigstore.json" \
            "${OUT}/MANIFEST.txt"
          BUNDLE="sealed-initrd-bundle-${{ github.sha }}.tgz"
          tar -C "${OUT}" -czf "${BUNDLE}" \
            sealed-initrd.img \
            AMDSEV.fd \
            vmlinuz \
            expected-measurement.txt \
            expected-measurement.sigstore.json \
            kernel-cmdline.txt \
            MANIFEST.txt \
            MANIFEST.sigstore.json \
            run-vm.sh \
            rootfs/sealed-shim \
            rootfs/init
          echo "bundle=${BUNDLE}" >> "$GITHUB_OUTPUT"

      - name: Upload signed GitHub artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sealed-initrd-bundle-signed-${{ github.sha }}
          path: |
            sealed-initrd-bundle-${{ github.sha }}.tgz
            out/sealed-initrd/expected-measurement.txt
            out/sealed-initrd/expected-measurement.sigstore.json
            out/sealed-initrd/MANIFEST.txt
            out/sealed-initrd/MANIFEST.sigstore.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish to Cloudflare R2
        if: github.event_name != 'pull_request' && steps.env.outputs.name != 'preview'
        env:
          ENV_NAME: ${{ steps.env.outputs.name }}
          GIT_SHA: ${{ github.sha }}
          BUNDLE_TGZ: sealed-initrd-bundle-${{ github.sha }}.tgz
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://pub-84b99924d959400aa97608c84bbd8000.r2.dev' }}
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" ]]; then
            echo "Missing R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY for environment '${ENV_NAME}'." >&2
            echo "Add them under Settings → Environments → ${ENV_NAME} (or repo Actions secrets)." >&2
            exit 1
          fi
          .github/workflows/sealed-initrd/upload-r2.sh
          cat "${OUT}/r2-publish.txt"
