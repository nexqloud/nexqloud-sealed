name: sealed-wipe image

on:
  push:
    branches: [main, stage]
    tags: ["v*"]
    paths:
      - "cmd/wipe-worker/**"
      - "internal/gpu/**"
      - "deploy/wipe-worker/**"
      - "scripts/vram_two_pass.py"
      - "scripts/publish-wipe-workers-allowlist.sh"
      - "go.mod"
      - "go.sum"
      - ".dockerignore"
      - ".github/workflows/wipe-worker-image.yml"
  pull_request:
    branches: [main, stage]
    paths:
      - "cmd/wipe-worker/**"
      - "internal/gpu/**"
      - "deploy/wipe-worker/**"
      - "scripts/vram_two_pass.py"
      - "scripts/publish-wipe-workers-allowlist.sh"
      - "go.mod"
      - "go.sum"
      - ".dockerignore"
      - ".github/workflows/wipe-worker-image.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/sealed-wipe
  R2_ACCOUNT_ID: "285ada7dda5a9110cc820302071df4f1"
  R2_BUCKET: "nexqloud-sealed-ai"

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/stage' && 'staging' || github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve deploy environment
        id: env
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/heads/stage)
              echo "name=staging" >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/main|refs/tags/v*)
              echo "name=production" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "name=preview" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=sealed-wipe
            nexqloud.deploy.environment=${{ steps.env.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=stage,enable=${{ github.ref == 'refs/heads/stage' }}
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/wipe-worker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read binary commitment from image
        id: commitment
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          if [ -z "${DIGEST}" ]; then
            echo "missing image digest" >&2
            exit 1
          fi
          REF="${IMAGE_NAME}@${DIGEST}"
          echo "Using image ${REF}"
          docker pull "${REF}"
          COMMITMENT="$(docker run --rm --entrypoint cat "${REF}" /usr/local/share/nexqloud/wipe-worker.commitment | tr -d '[:space:]')"
          case "${COMMITMENT}" in
            sha256:*) ;;
            *) echo "invalid commitment from image: ${COMMITMENT}" >&2; exit 1 ;;
          esac
          echo "commitment=${COMMITMENT}"
          echo "value=${COMMITMENT}" >> "$GITHUB_OUTPUT"

      - name: Publish workers allowlist (R2 + repo)
        if: github.event_name != 'pull_request' && steps.env.outputs.name != 'preview'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ENV_NAME: ${{ steps.env.outputs.name }}
          COMMITMENT: ${{ steps.commitment.outputs.value }}
        run: |
          set -euo pipefail
          chmod +x scripts/publish-wipe-workers-allowlist.sh
          PUBLISH_R2=1 ./scripts/publish-wipe-workers-allowlist.sh
          if git diff --quiet -- web/sealed-wipe-workers/"${ENV_NAME}"/allowlist.json; then
            echo "workers allowlist already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/sealed-wipe-workers/"${ENV_NAME}"/allowlist.json
          git commit -m "chore(wipe): pin worker commitment ${COMMITMENT:7:12}… (${ENV_NAME})"
          git push

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest (keyless → Rekor)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "missing image digest from build-push" >&2
            exit 1
          fi
          echo "Signing ${IMAGE_NAME}@${DIGEST} for ${{ steps.env.outputs.name }}"
          cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
